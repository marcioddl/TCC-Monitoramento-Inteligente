name: miiu_app
description: "MIIU: aplicativo do cidadão para reporte colaborativo de problemas de infraestrutura urbana."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# As faixas de versao abrangem duas versoes maiores quando a API usada pelo
# app e a mesma nas duas; o pub escolhe a mais nova compativel com o seu SDK.
dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  shared_preferences: ^2.3.0
  uuid: ^4.4.0
  geolocator: ">=13.0.0 <15.0.0"
  image_picker: ^1.1.0
  flutter_map: ">=7.0.0 <9.0.0"
  latlong2: ^0.9.1
  firebase_core: ">=3.0.0 <6.0.0"
  firebase_messaging: ">=15.0.0 <18.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
